[pytest]
testpaths = tests
addopts = -v --tb=short
markers =
    integracao_db: testes que leem/escrevem no PostgreSQL real (pulam se o banco nao estiver acessivel)
    integracao_servicos: testes que dependem de servidor HTTP local, planilhas e GeoJSON reais

[coverage:run]
source = db, api/services, app
omit =
    */venv/*
    */tests/*
